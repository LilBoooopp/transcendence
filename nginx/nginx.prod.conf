events {
  worker_connections 1024;
}

# Production nginx sits behind a TLS-terminating reverse proxy (Nginx Proxy Manager + Let's Encrypt):
# it speaks plain HTTP and holds no certificate. Point the proxy host at http://<this host>:HTTP_PORT
# with "Websockets Support" enabled.
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  # Avatars are capped at 5 MB by the backend.
  client_max_body_size 6m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

  # Every request arrives from the proxy: trust its X-Forwarded-For (only from TRUSTED_PROXY, see
  # templates/realip.conf.template) so $remote_addr is the visitor again. Rate limits here and in the
  # backend then count per visitor, and the backend reads that address as the last X-Forwarded-For hop.
  include /etc/nginx/conf.d/*.conf;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  limit_req_status 429;

  server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Keep every add_header at this level: a location that declares its own stops inheriting these.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The session token lives in localStorage, so an injected script would own the account: only run our own code.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://ui-avatars.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Static frontend build (no dev server in production)
    root /usr/share/nginx/html;

    location / {
      try_files $uri /index.html;
    }

    location /static/ {
      expires 1y;
      try_files $uri =404;
    }

    # backend api (CORS is answered by the backend allowlist, not here)
    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;

      proxy_pass http://backend:4000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /socket.io/ {
      proxy_pass http://backend:4000/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

      proxy_buffering off;
      proxy_cache off;

      proxy_read_timeout 86400;
      proxy_send_timeout 86400;
    }
  }
}
